<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asistente Virtual Alcaldia</title>
    <link rel="stylesheet" href="/web/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section id="sidebar-panel" class="sidebar" aria-label="Temas disponibles">
        <div class="brand">
          <div class="brand-mark">IA</div>
          <div>
            <p class="eyebrow">Atencion institucional</p>
            <h1 id="assistant-name">Asistente Virtual</h1>
          </div>
        </div>

        <div class="status">
          <span class="status-dot"></span>
          Servicio en linea
        </div>

        <h2>Temas disponibles</h2>
        <div id="topics" class="topics"></div>
      </section>

      <section class="chat-panel" aria-label="Asistencia virtual">
        <header class="chat-header">
          <div>
            <p class="eyebrow">Canal digital</p>
            <h2>Asistente de orientacion</h2>
            <p class="chat-subtitle">Respuestas orientativas para consultas de servicio, educacion y salud.</p>
          </div>
          <div class="header-actions">
            <button id="toggle-sidebar" class="ghost-button mobile-only" type="button" aria-expanded="false" aria-controls="sidebar-panel">
              Ver temas
            </button>
            <button id="clear-chat" class="ghost-button" type="button">Nueva consulta</button>
          </div>
        </header>

        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="chat-form" class="composer">
          <label class="sr-only" for="question">Pregunta del ciudadano</label>
          <input
            id="question"
            name="question"
            type="text"
            autocomplete="off"
            placeholder="Escribe tu consulta. Ejemplo: requisitos de atencion"
            maxlength="500"
            required
          />
          <button type="submit">Enviar</button>
          <p class="composer-hint">Sugerencia: selecciona un tema para completar tu consulta mas rapido.</p>
        </form>
      </section>
    </main>

    <script src="/web/app.js"></script>
  </body>
</html>
